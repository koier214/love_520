<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .qrcode {
            margin: 20px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }
        
        .url {
            font-family: monospace;
            font-size: 14px;
            color: #666;
            word-break: break-all;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-top: 15px;
        }
        
        .tip {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>扫描二维码访问页面</h2>
        <div class="qrcode">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://love-520-brown.vercel.app/" 
                 alt="二维码" />
        </div>
        <div class="url">https://love-520-brown.vercel.app/</div>
        <div class="tip">提示：扫码即可访问线上页面(vpn)</div>
    </div>
</body>
</html>
