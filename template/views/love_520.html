<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 樱花祈愿 💕</title>
    <style>
        /* ===== 基础重置样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #fff0f3 0%, #ffe4ec 30%, #ffd6e7 60%, #ffcce0 100%);
            position: relative;
        }
        
        /* ===== 桌面端样式 ===== */
        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .bg-petal {
            position: absolute;
            font-size: 16px;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.3; }
            25% { transform: translateY(-20px) translateX(10px) rotate(180deg); opacity: 0.5; }
            50% { transform: translateY(-40px) translateX(-5px) rotate(360deg); opacity: 0.3; }
            75% { transform: translateY(-20px) translateX(15px) rotate(540deg); opacity: 0.5; }
        }
        
        /* 标题 */
        .title-section {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
            z-index: 10;
        }
        
        .title {
            font-size: 32px;
            color: #ff6b95;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 107, 149, 0.3);
        }
        
        .subtitle {
            font-size: 14px;
            color: #e891a4;
            letter-spacing: 2px;
        }
        
        /* 520日期标签 */
        .date-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b95 100%);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(255, 107, 149, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 25px rgba(255, 107, 149, 0.4); }
            50% { box-shadow: 0 8px 35px rgba(255, 107, 149, 0.6); }
        }
        
        /* 樱花容器 - 桌面端 */
        .flowers-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        
        .flowers-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }
        
        /* 樱花花朵 - 桌面端 */
        .flower {
            position: absolute;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            filter: grayscale(100%);
            opacity: 0.6;
        }
        
        .flower:hover {
            transform: scale(1.4);
            filter: grayscale(30%);
            opacity: 0.9;
        }
        
        .flower.active {
            filter: grayscale(0%);
            opacity: 1;
            animation: bloom 1.5s ease-in-out infinite;
        }
        
        @keyframes bloom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        /* 祈福弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 196, 214, 0.6);
            backdrop-filter: blur(10px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: white;
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 80px rgba(255, 107, 149, 0.4);
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .modal::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b95 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 25px rgba(255, 107, 149, 0.5);
        }
        
        .modal::after {
            content: '🌸';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            z-index: 1;
        }
        
        .modal h3 {
            color: #ff6b95;
            font-size: 22px;
            margin-bottom: 25px;
            text-align: center;
            margin-top: 15px;
        }
        
        .modal textarea {
            width: 100%;
            height: 120px;
            padding: 18px;
            border: 2px solid #ffe4ec;
            border-radius: 15px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            background: #fff8fa;
        }
        
        .modal textarea:focus {
            border-color: #ff9a9e;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.1);
        }
        
        .modal textarea::placeholder {
            color: #e8c0ca;
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 25px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b95 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 149, 0.5);
        }
        
        .btn-default {
            background: #f8f8f8;
            color: #888;
        }
        
        .btn-default:hover {
            background: #ffe4ec;
            color: #ff6b95;
            transform: translateY(-2px);
        }
        
        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #e891a4;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        /* 底部爱心装饰 */
        .hearts {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            z-index: 5;
        }
        
        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatHeart 4s ease-in-out infinite;
            opacity: 0.5;
        }
        
        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
            50% { transform: translateY(-40px) rotate(15deg); opacity: 0.7; }
        }
        
        /* ===== 移动端CSS框架 (max-width: 768px) ===== */
        @media (max-width: 768px) {
            /* 基础重置 - 确保无滚动条 */
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
            }
            
            /* 隐藏背景装饰 */
            .bg-decoration {
                display: none;
            }
            
            /* 隐藏底部爱心装饰 */
            .hearts {
                display: none;
            }
            
            /* 隐藏底部提示 */
            .hint {
                display: none;
            }
            
            /* 调整标题区域 */
            .title-section {
                padding: 25px 15px 10px;
                padding-top: calc(25px + env(safe-area-inset-top));
            }
            
            .title {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 10px;
                letter-spacing: 1px;
            }
            
            /* 520日期标签 */
            .date-badge {
                top: calc(12px + env(safe-area-inset-top));
                right: 12px;
                padding: 5px 12px;
                font-size: 10px;
                gap: 4px;
            }
            
            /* 樱花容器 - 全屏布局 */
            .flowers-container {
                width: 100%;
                height: calc(100vh - 100px - env(safe-area-inset-top));
                min-height: 0;
                padding: 10px;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            /* 花朵包装器 - 自适应尺寸 */
            .flowers-wrapper {
                position: relative;
                width: 100%;
                max-width: 360px;
                height: calc(100vh - 120px - env(safe-area-inset-top));
                max-height: 420px;
            }
            
            /* 樱花花朵 - 移动端专用样式 */
            .flower {
                position: absolute;
                cursor: pointer;
                filter: grayscale(100%);
                opacity: 0.6;
                transition: all 0.3s ease;
                z-index: 10;
                /* 根据屏幕宽度动态调整 */
                font-size: 24px;
            }
            
            .flower:active {
                transform: scale(1.2);
                filter: grayscale(30%);
                opacity: 0.9;
            }
            
            .flower.active {
                filter: grayscale(0%);
                opacity: 1;
                animation: bloom 1.5s ease-in-out infinite;
            }
            
            /* 弹窗 - 移动端优化 */
            .modal-overlay {
                background: rgba(255, 196, 214, 0.8);
            }
            
            .modal {
                padding: 25px 20px;
                width: 92%;
                max-width: 320px;
                margin: 0 10px;
            }
            
            .modal h3 {
                font-size: 16px;
                margin-bottom: 18px;
            }
            
            .modal textarea {
                height: 100px;
                padding: 14px;
                font-size: 13px;
            }
            
            .btn {
                padding: 12px;
                font-size: 13px;
            }
        }
        
        /* 小屏手机适配 (max-width: 480px) */
        @media (max-width: 480px) {
            .title-section {
                padding: 20px 10px 8px;
                padding-top: calc(20px + env(safe-area-inset-top));
            }
            
            .title {
                font-size: 18px;
            }
            
            .subtitle {
                font-size: 9px;
            }
            
            .date-badge {
                top: calc(10px + env(safe-area-inset-top));
                right: 10px;
                padding: 4px 10px;
                font-size: 9px;
            }
            
            .flowers-wrapper {
                max-width: 320px;
                height: calc(100vh - 110px - env(safe-area-inset-top));
                max-height: 380px;
            }
            
            .flower {
                font-size: 22px;
            }
            
            .modal {
                padding: 22px 18px;
                width: 95%;
                max-width: 290px;
            }
            
            .modal h3 {
                font-size: 15px;
            }
            
            .modal textarea {
                height: 90px;
                font-size: 12px;
            }
            
            .btn {
                padding: 11px;
                font-size: 12px;
            }
        }
        
        /* 超小屏手机适配 (max-width: 360px) */
        @media (max-width: 360px) {
            .title-section {
                padding: 18px 8px 6px;
            }
            
            .title {
                font-size: 16px;
            }
            
            .subtitle {
                font-size: 8px;
            }
            
            .date-badge {
                padding: 3px 8px;
                font-size: 8px;
            }
            
            .flowers-wrapper {
                max-width: 280px;
                height: calc(100vh - 100px - env(safe-area-inset-top));
                max-height: 340px;
            }
            
            .flower {
                font-size: 20px;
            }
            
            .modal {
                padding: 20px 15px;
                max-width: 260px;
            }
            
            .modal h3 {
                font-size: 14px;
            }
            
            .modal textarea {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰花瓣 -->
    <div class="bg-decoration" id="bgDecoration"></div>
    
    <!-- 标题区域 -->
    <div class="title-section">
        <h1 class="title">🌸 樱花祈愿 🌸</h1>
        <p class="subtitle">点击樱花，写下你的祝福</p>
    </div>
    
    <!-- 520日期标签 -->
    <div class="date-badge">
        <span>💕</span>
        <span>520 专属</span>
    </div>
    
    <!-- 底部爱心装饰 -->
    <div class="hearts" id="heartsContainer"></div>
    
    <!-- 樱花容器 -->
    <div class="flowers-container">
        <div class="flowers-wrapper" id="flowersContainer">
            <!-- 樱花将通过JS生成 -->
        </div>
    </div>
    
    <!-- 祈福弹窗 -->
    <div class="modal-overlay" id="wishModal">
        <div class="modal">
            <h3>💕 写下你的祝福 💕</h3>
            <textarea id="wishInput" placeholder="在这里写下你想说的话..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-default" onclick="closeWishModal()">取消</button>
                <button class="btn btn-primary" onclick="submitWish()">发送祝福</button>
            </div>
        </div>
    </div>
    
    <!-- 提示文字 -->
    <div class="hint">
        <span>�</span>
        <span>灰色樱花等待祝福，粉色樱花已有心愿~</span>
    </div>
    
    <script>
        // 花朵位置数据（固定，确保每次刷新位置一致）
        const flowerPositions = [];
        
        // 判断是否为移动端
        function isMobile() {
            return window.innerWidth <= 768;
        }
        
        (function generateFlowerPositions() {
            if (isMobile()) {
                // 移动端专用位置 - 紧凑布局，确保全部显示在可视区域内
                // 3行 x 4列布局
                const rows = 3;
                const cols = 4;
                const spacingX = 70;  // 减小水平间距
                const spacingY = 85;  // 减小垂直间距
                const startX = -120;  // 居中起始位置
                const startY = -110;  // 居中起始位置
                
                let seed = 5201314;
                const random = () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const offsetX = (random() - 0.5) * 20;
                        const offsetY = (random() - 0.5) * 25;
                        
                        const x = startX + col * spacingX + offsetX;
                        const y = startY + row * spacingY + offsetY;
                        
                        // 移动端不跳过任何花朵，确保数量足够且分布均匀
                        flowerPositions.push({ x, y });
                    }
                }
            } else {
                // 桌面端布局
                const rows = 4;
                const cols = 6;
                const spacingX = 90;
                const spacingY = 110;
                const startX = -220;
                const startY = -160;
                
                let seed = 5201314;
                const random = () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const offsetX = (random() - 0.5) * 50;
                        const offsetY = (random() - 0.5) * 60;
                        
                        const x = startX + col * spacingX + offsetX;
                        const y = startY + row * spacingY + offsetY;
                        
                        if (random() > 0.15) {
                            flowerPositions.push({ x, y });
                        }
                    }
                }
            }
        })();
        
        // localStorage 操作
        const WISHES_KEY = 'sakura_wishes';
        
        // 默认祝福数据（两朵樱花有内容）
        const DEFAULT_WISHES = {
            0: '愿你每一天都充满阳光和微笑~ 💕',
            5: '愿所有美好的事情都围绕着你~ ✨',
            8:'希望小宝天天开心~爱你的大宝（づ￣3￣）づ╭❤～'
        };
        
        function saveWishes(wishes) {
            localStorage.setItem(WISHES_KEY, JSON.stringify(wishes));
        }
        
        function getWishes() {
            const saved = localStorage.getItem(WISHES_KEY);
            // 如果没有保存的数据，返回默认祝福
            if (!saved) {
                // 保存默认数据到 localStorage
                saveWishes(DEFAULT_WISHES);
                return DEFAULT_WISHES;
            }
            return JSON.parse(saved);
        }
        
        // 生成背景装饰花瓣
        function createBgPetals() {
            const container = document.getElementById('bgDecoration');
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('span');
                petal.className = 'bg-petal';
                petal.textContent = '🌸';
                petal.style.left = (Math.random() * 100) + '%';
                petal.style.top = (Math.random() * 100) + '%';
                petal.style.fontSize = (12 + Math.random() * 12) + 'px';
                petal.style.animationDuration = (6 + Math.random() * 4) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(petal);
            }
        }
        
        // 生成底部爱心
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const positions = [8, 18, 28, 38, 48, 58, 68, 78, 88, 95];
            
            positions.forEach((pos, index) => {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = '❤️';
                heart.style.left = pos + '%';
                heart.style.bottom = (10 + Math.random() * 30) + 'px';
                heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                heart.style.animationDelay = index * 0.25 + 's';
                heart.style.fontSize = (14 + Math.random() * 12) + 'px';
                container.appendChild(heart);
            });
        }
        
        // 生成樱花花朵
        function createFlowers() {
            const container = document.getElementById('flowersContainer');
            const wishes = getWishes();
            const mobile = isMobile();
            
            flowerPositions.forEach((pos, index) => {
                const flowerEl = document.createElement('div');
                flowerEl.className = 'flower';
                flowerEl.style.left = `calc(50% + ${pos.x}px)`;
                flowerEl.style.top = `calc(50% + ${pos.y}px)`;
                flowerEl.innerHTML = '<span>🌸</span>';
                
                // 移动端使用统一稍小的花朵尺寸，桌面端使用渐变尺寸
                if (mobile) {
                    flowerEl.style.fontSize = '28px';
                } else {
                    flowerEl.style.fontSize = (30 + (index * 5) % 20) + 'px';
                }
                
                flowerEl.onclick = () => openWishModal(index);
                
                // 如果有祝福，点亮樱花（粉色）
                if (wishes[index]) {
                    flowerEl.classList.add('active');
                }
                
                container.appendChild(flowerEl);
            });
        }
        
        // 打开祈福弹窗
        let currentFlowerIndex = -1;
        
        function openWishModal(index) {
            currentFlowerIndex = index;
            const wishes = getWishes();
            // 如果已有祝福，显示在输入框中
            if (wishes[index]) {
                document.getElementById('wishInput').value = wishes[index];
            } else {
                document.getElementById('wishInput').value = '';
            }
            document.getElementById('wishModal').classList.add('active');
            document.getElementById('wishInput').focus();
        }
        
        // 关闭祈福弹窗
        function closeWishModal() {
            document.getElementById('wishModal').classList.remove('active');
            document.getElementById('wishInput').value = '';
            currentFlowerIndex = -1;
        }
        
        // 提交祝福
        function submitWish() {
            const wish = document.getElementById('wishInput').value.trim();
            
            if (!wish) {
                alert('请输入祝福内容~');
                return;
            }
            
            const flowers = document.querySelectorAll('.flower');
            if (currentFlowerIndex >= 0 && currentFlowerIndex < flowers.length) {
                const flower = flowers[currentFlowerIndex];
                
                // 点亮樱花（粉色）
                flower.classList.add('active');
                
                // 保存到 localStorage
                const wishes = getWishes();
                wishes[currentFlowerIndex] = wish;
                saveWishes(wishes);
            }
            
            closeWishModal();
        }
        
        // 点击遮罩关闭弹窗
        document.getElementById('wishModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('wishModal')) {
                closeWishModal();
            }
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createBgPetals();
            createHearts();
            createFlowers();
        });
    </script>
</body>
</html>
