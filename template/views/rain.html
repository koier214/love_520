<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝等我~</title>
    <link rel="stylesheet" href="../static/index.css">
</head>
<body>
    <div class="rain-container">
        <div class="raindrop" style="left: 10%; animation-delay: 0s;"></div>
        <div class="raindrop" style="left: 20%; animation-delay: 0.5s;"></div>
        <div class="raindrop" style="left: 30%; animation-delay: 1s;"></div>
        <div class="raindrop" style="left: 45%; animation-delay: 0.3s;"></div>
        <div class="raindrop" style="left: 55%; animation-delay: 0.8s;"></div>
        <div class="raindrop" style="left: 70%; animation-delay: 0.2s;"></div>
        <div class="raindrop" style="left: 80%; animation-delay: 0.6s;"></div>
        <div class="raindrop" style="left: 90%; animation-delay: 0.9s;"></div>
    </div>
    
    <div class="cloud-container">
        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="cloud cloud3">☁️</div>
    </div>

    <div class="container">
        <div class="heart-container">
            <div class="heart">💗</div>
            <div class="heart heart2">💓</div>
            <div class="heart heart3">💕</div>
        </div>
        <h1>宝宝等我</h1>
        <p class="main-text">我现在就把武汉下的雨</p>
        <p class="main-text highlight">给吸回重庆~</p>
        <p class="blow-text">呼呼呼~~~ 💨</p>
        <div class="wind">🌬️</div>
    </div>

    <div class="float-hearts">
        <span class="float-heart">❤️</span>
        <span class="float-heart">💖</span>
        <span class="float-heart">💝</span>
        <span class="float-heart">💗</span>
        <span class="float-heart">💕</span>
    </div>
    
    <script src="../static/index.js"></script>
</body>
</html>
